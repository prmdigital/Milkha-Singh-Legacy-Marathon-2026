<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" role="img" aria-label="Placeholder for the official marathon route map">
  <rect width="1200" height="600" fill="#FFFFFF"/>
  <rect x="8" y="8" width="1184" height="584" fill="none" stroke="#F97316" stroke-opacity=".4" stroke-width="2" stroke-dasharray="12 10" rx="12"/>

  <g stroke="#EDF0F5" stroke-width="1">
    <path d="M0 100h1200M0 200h1200M0 300h1200M0 400h1200M0 500h1200"/>
    <path d="M100 0v600M300 0v600M500 0v600M700 0v600M900 0v600M1100 0v600"/>
  </g>

  <path d="M180 430 C 300 300, 420 470, 540 330 S 780 200, 900 300 S 1030 400, 1030 180"
        fill="none" stroke="#FF9933" stroke-width="5"
        stroke-linecap="round" stroke-dasharray="16 12"/>

  <circle cx="180" cy="430" r="12" fill="#128807"/>
  <circle cx="1030" cy="180" r="12" fill="#F97316"/>

  <g font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#12295B">
    <text x="180" y="470" text-anchor="middle">START</text>
    <text x="1030" y="150" text-anchor="middle">FINISH</text>
  </g>

  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="600" y="80" font-size="26" font-weight="bold" fill="#12295B" letter-spacing="4">PLACEHOLDER — OFFICIAL ROUTE MAP</text>
    <text x="600" y="550" font-size="17" fill="#8B93A1">Replace once the Chandigarh route, distances and flag-off points are confirmed.</text>
  </g>
</svg>
