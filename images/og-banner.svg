<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="The Flying Sikh Milkha Singh Legacy Marathon 2026, 20 December 2026, Chandigarh">
  <defs>
    <linearGradient id="tri" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF9933"/>
      <stop offset=".5" stop-color="#FF9933"/>
      <stop offset=".5" stop-color="#128807"/>
      <stop offset="1" stop-color="#128807"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F97316"/>
      <stop offset="1" stop-color="#128807"/>
    </linearGradient>
    <radialGradient id="glowS" cx="10%" cy="0%" r="60%">
      <stop offset="0" stop-color="#FF9933" stop-opacity=".18"/>
      <stop offset="1" stop-color="#FF9933" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowG" cx="90%" cy="100%" r="60%">
      <stop offset="0" stop-color="#128807" stop-opacity=".14"/>
      <stop offset="1" stop-color="#128807" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="#FFFFFF"/>
  <rect width="1200" height="630" fill="url(#glowS)"/>
  <rect width="1200" height="630" fill="url(#glowG)"/>

  <!-- tricolor top and bottom bands -->
  <rect x="0" y="0" width="1200" height="14" fill="#FF9933"/>
  <rect x="0" y="616" width="1200" height="14" fill="#128807"/>

  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="600" y="140" font-size="21" font-weight="bold" fill="#F97316" letter-spacing="6">FOREVER LEGEND FOUNDATION PRESENTS</text>

    <text x="600" y="256" font-size="88" font-weight="bold" fill="#12295B" letter-spacing="1">Milkha Singh</text>
    <text x="600" y="352" font-size="70" font-weight="bold" fill="url(#accent)" letter-spacing="1">Legacy Marathon</text>
    <text x="600" y="408" font-size="34" font-weight="bold" fill="#8B93A1" letter-spacing="16">2026</text>

    <rect x="440" y="442" width="107" height="5" fill="#FF9933"/>
    <rect x="547" y="442" width="106" height="5" fill="#E7EAF0"/>
    <rect x="653" y="442" width="107" height="5" fill="#128807"/>

    <text x="600" y="506" font-size="30" font-weight="bold" fill="#12295B" letter-spacing="2">20 DECEMBER 2026  |  CHANDIGARH</text>
    <text x="600" y="560" font-size="25" font-weight="bold" fill="#F97316" letter-spacing="4">ONE RUN. ONE PLEDGE. ONE NATION.</text>
  </g>
</svg>
